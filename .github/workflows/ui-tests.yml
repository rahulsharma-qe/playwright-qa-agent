name: UI tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run the UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      report-scanned: ${{ steps.report.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the tests
        run: npm test

      # Runs even when tests fail, so a red run still has its report.
      # Includes the secret scan: if a test-account password is in the results or the report, this step fails.
      - name: Build the Allure report and scan it for secrets
        id: report
        if: ${{ !cancelled() }}
        run: npm run report:build

      # Only a report that passed the secret scan is uploaded.
      - name: Upload the Allure report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Prepare the report for GitHub Pages
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report/

  publish-report:
    name: Publish the report on GitHub Pages
    needs: test
    # Main only; also when tests fail, so the published report shows the failure; never an unscanned report.
    if: ${{ !cancelled() && needs.test.outputs.report-scanned == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
