name: UI tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run the UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30  # first value; set from measured runs
    # CI tests its own copy of Toolshop: the public site shows a bot check to CI machines.
    env:
      BASE_URL: http://localhost:4200
      API_URL: http://localhost:8091
    outputs:
      report-scanned: ${{ steps.report.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Toolshop's web server image is published for arm64 only; QEMU lets this amd64 runner run it.
      - name: Allow arm64 images (emulation)
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Start Toolshop (own copy, pinned images)
        id: start
        run: ci/start-toolshop.sh

      - name: Run the tests
        run: npm test

      # The AI test agents' starting test (tests/seed.spec.ts), kept out of `npm test` and run here on its own,
      # so a change to the fixtures cannot break it unnoticed. Never run by the with-bugs workflow.
      # Its own reporter only: its results stay out of the Allure report (it re-runs the set-up, which would show twice).
      # It registers one more test account, which the secret scan also checks.
      - name: Check the agents' starting test (seed)
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: npm run test:seed -- --reporter=list

      - name: Show the last Toolshop logs
        if: ${{ failure() }}
        run: docker compose -p toolshop logs --tail 60

      # Runs even when tests fail, so a red run still has its report.
      # Includes the secret scan: if a test-account password is in the results or the report, this step fails.
      - name: Build the Allure report and scan it for secrets
        id: report
        # Only when Toolshop started: otherwise no test ran and there is nothing to report or scan.
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: npm run report:build

      # Only a report that passed the secret scan is uploaded.
      - name: Upload the Allure report
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Prepare the report for GitHub Pages
        if: ${{ !cancelled() && steps.report.outcome == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report/

      - name: Stop Toolshop
        if: ${{ always() }}
        run: ci/stop-toolshop.sh

  publish-report:
    name: Publish the report on GitHub Pages
    needs: test
    # Main only; also when tests fail, so the published report shows the failure; never an unscanned report.
    if: ${{ !cancelled() && needs.test.outputs.report-scanned == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
